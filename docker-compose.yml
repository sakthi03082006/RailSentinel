services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: railsentinel
      POSTGRES_PASSWORD: railsentinel
      POSTGRES_DB: railsentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railsentinel -d railsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://railsentinel:railsentinel@db:5432/railsentinel
      SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
      THREAT_YELLOW_THRESHOLD: 31
      THREAT_RED_THRESHOLD: 61
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend-test:
    build:
      context: ./backend
    profiles:
      - test
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://railsentinel:railsentinel@db:5432/railsentinel
      SECRET_KEY: test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    entrypoint:
      - /bin/sh
      - -c
      - alembic upgrade head && pytest -q

volumes:
  pgdata:
